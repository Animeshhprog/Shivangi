<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Shivangi ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#ffe6ec,#fff5f8);
position:relative;
}

.heart{
position:absolute;
top:-20px;
color:#ff4f81;
animation:fall linear infinite;
}

@keyframes fall{

0%{
transform:translateY(-10vh);
opacity:0;
}

100%{
transform:translateY(110vh);
opacity:1;
}

}

.container{
width:90%;
max-width:700px;
background:white;
padding:40px;
border-radius:30px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
z-index:10;
}

h1{
font-size:52px;
color:#d6336c;
margin-bottom:20px;
}

img{
width:280px;
margin:25px 0;
border-radius:20px;
}

p{
font-size:24px;
line-height:1.8;
color:#444;
}

.btn{
display:inline-block;
margin-top:35px;
padding:16px 35px;
background:#ff4f81;
color:white;
text-decoration:none;
border-radius:50px;
font-size:22px;
font-weight:bold;
transition:0.3s;
}

.btn:hover{
transform:scale(1.08);
}

</style>
</head>

<body>

<script>

for(let i=0;i<70;i++){

let heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*25)+"px";

heart.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(heart);

}

</script>

<div class="container">

<h1>I Know I Messed Up Shivangi 💔</h1>

<img src="Donkey.webp">

<p>

But I really want to correct myself.<br>

I am only seeking for an opportunity.<br>

Please give me a chance 🥺

</p>

<a href="page2.html" class="btn">

Please Listen To Me ❤️

</a>

</div>

</body>
</html>
