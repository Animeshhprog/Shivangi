<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorry Shivangi</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Poppins', sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(to bottom,#ffe6ec,#fff5f7);
      position:relative;
    }

    /* Falling Hearts */
    .heart{
      position:absolute;
      top:-20px;
      color:pink;
      font-size:20px;
      animation: fall linear infinite;
      opacity:0.8;
    }

    @keyframes fall{
      0%{
        transform:translateY(-10vh) rotate(0deg);
        opacity:0;
      }
      10%{
        opacity:1;
      }
      100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
      }
    }

    .container{
      width:90%;
      max-width:420px;
      background:rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      border-radius:30px;
      padding:30px 25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.15);
      position:relative;
      z-index:10;
    }

    .top-text{
      font-size:18px;
      color:#333;
      line-height:1.7;
      margin-bottom:20px;
    }

    .cat{
      width:140px;
      margin:10px auto;
      display:block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    h1{
      font-size:42px;
      margin-top:15px;
      color:#5a2a2a;
      font-family:cursive;
    }

    .sub{
      margin-top:15px;
      font-size:22px;
      color:#444;
      line-height:1.5;
    }

    .btn{
      margin-top:35px;
      display:inline-block;
      padding:16px 40px;
      border-radius:50px;
      background:linear-gradient(to right,#ff5f8f,#ff3d71);
      color:white;
      text-decoration:none;
      font-size:22px;
      font-weight:bold;
      box-shadow:0 8px 20px rgba(255,77,121,0.4);
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.08);
    }
  </style>
</head>
<body>

  <!-- Hearts -->
  <script>
    for(let i=0;i<50;i++){
      let heart=document.createElement("div");
      heart.className="heart";
      heart.innerHTML="❤";

      heart.style.left=Math.random()*100+"vw";
      heart.style.animationDuration=(3+Math.random()*5)+"s";
      heart.style.fontSize=(15+Math.random()*25)+"px";

      document.body.appendChild(heart);
    }
  </script>

  <!-- Main Card -->
  <div class="container">

    <div class="top-text">
      I'm sorryyy, I hurted you But trust Me i never wanted to hurt you
      i always wanted to care and see you happy I am sorry sorry sorry ❤️🥺
    </div>

    <!-- Cute Cat GIF -->
    <img 
      class="cat"
      src="https://media.tenor.com/0AVbKGY_MxMAAAAC/sad-cat.gif"
      alt="Sad Cat"
    >

    <h1>I Messed Up, Shivangi 😢</h1>

    <div class="sub">
      But I'm ready to make it right.<br>
      Will you hear me out?
    </div>

    <a href="#" class="btn">Listen to my heart 💖</a>

  </div>

</body>
</html>
