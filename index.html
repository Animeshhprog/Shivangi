<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Shivangi ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
font-family:Poppins,sans-serif;
}

body{
min-height:100vh;
overflow-x:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#ffe6ec,#fff5f8);
position:relative;
padding:40px 20px;
}

/* FALLING HEARTS */

.heart{
position:fixed;
top:-20px;
color:#ff4f81;
animation:fall linear infinite;
opacity:0.8;
z-index:1;
pointer-events:none;
}

@keyframes fall{

0%{
transform:translateY(-10vh) rotate(0deg);
opacity:0;
}

10%{
opacity:1;
}

100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}

}

/* MAIN CONTAINER */

.container{
width:90%;
max-width:750px;
background:rgba(255,255,255,0.95);
padding:50px;
border-radius:35px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
position:relative;
z-index:10;
overflow:hidden;
}

/* SIDE BORDER */

.container::before{
content:"";
position:absolute;
left:0;
top:0;
width:8px;
height:100%;
background:linear-gradient(#ff5f8f,#ff2f6d);
}

/* HEADING */

h1{
font-size:54px;
color:#d6336c;
margin-bottom:25px;
font-family:cursive;
line-height:1.4;
}

/* IMAGE */

img{
width:320px;
max-width:100%;
margin:25px 0;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* TEXT */

p{
font-size:26px;
line-height:2;
color:#444;
margin-top:10px;
}

/* BUTTON */

.btn{
display:inline-block;
margin-top:40px;
padding:18px 38px;
background:linear-gradient(to right,#ff5f8f,#ff2f6d);
color:white;
text-decoration:none;
border-radius:50px;
font-size:24px;
font-weight:bold;
transition:0.3s;
box-shadow:0 8px 20px rgba(255,77,121,0.35);
}

.btn:hover{
transform:scale(1.08);
}

/* MOBILE */

@media(max-width:768px){

.container{
padding:35px 25px;
}

h1{
font-size:38px;
}

p{
font-size:20px;
}

.btn{
font-size:20px;
padding:15px 28px;
}

img{
width:250px;
}

}

</style>
</head>

<body>

<!-- FALLING HEARTS -->

<script>

for(let i=0;i<80;i++){

let heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*25)+"px";

heart.style.animationDuration=(3+Math.random()*5)+"s";

heart.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(heart);

}

</script>

<!-- MAIN CONTENT -->

<div class="container">

<h1>

I Know I Messed Up Shivangi 💔

</h1>

<img src="Donkey.webp" alt="Sorry Donkey">

<p>

But I really want to correct myself.<br><br>

I am only seeking for an opportunity.<br><br>

Please give me a chance 🥺

</p>

<a href="./page2.html" class="btn">

Please Listen To Me ❤️

</a>

</div>

</body>
</html>
