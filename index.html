<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorry Shivangi</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(to bottom,#ffe6ec,#fff7fa);
      position:relative;
    }

    /* Falling Hearts */
    .heart{
      position:absolute;
      top:-20px;
      color:#ff6b9c;
      animation:fall linear infinite;
      opacity:0.8;
      z-index:1;
    }

    @keyframes fall{
      0%{
        transform:translateY(-10vh) rotate(0deg);
        opacity:0;
      }
      10%{
        opacity:1;
      }
      100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
      }
    }

    .container{
      width:90%;
      max-width:430px;
      background:rgba(255,255,255,0.75);
      backdrop-filter:blur(10px);
      border-radius:30px;
      padding:35px 25px 45px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.15);
      position:relative;
      z-index:10;
    }

    /* TOP TITLE */
    .main-title{
      font-size:34px;
      color:#7a1f3d;
      font-weight:bold;
      line-height:1.3;
      margin-bottom:30px;
      font-family:cursive;
    }

    /* DONKEY IMAGE */
    .donkey{
      width:220px;
      margin:auto;
      display:block;
      animation:bounce 2s infinite;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-8px);
      }
    }

    /* TEXT SHIFTED DOWN */
    .message{
      margin-top:35px;
      font-size:20px;
      color:#444;
      line-height:1.8;
    }

    .btn{
      display:inline-block;
      margin-top:35px;
      padding:16px 38px;
      border-radius:50px;
      background:linear-gradient(to right,#ff5f8f,#ff2f6d);
      color:white;
      text-decoration:none;
      font-size:21px;
      font-weight:bold;
      box-shadow:0 8px 20px rgba(255,77,121,0.4);
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.08);
    }
  </style>
</head>
<body>

  <!-- HEARTS -->
  <script>
    for(let i=0;i<60;i++){
      let heart=document.createElement("div");
      heart.classList.add("heart");

      heart.innerHTML="❤";

      heart.style.left=Math.random()*100+"vw";
      heart.style.fontSize=(15+Math.random()*25)+"px";
      heart.style.animationDuration=(3+Math.random()*5)+"s";
      heart.style.animationDelay=Math.random()*5+"s";

      document.body.appendChild(heart);
    }
  </script>

  <div class="container">

    <!-- TOP TEXT -->
    <div class="main-title">
      I Know I Messed Up Shivangi 😔
    </div>

    <!-- DONKEY IMAGE -->
    <img
      class="donkey"
      src="https://i.imgur.com/8Km9tLL.png"
      alt="Sorry Donkey"
    >

    <!-- LOWER MESSAGE -->
    <div class="message">
      I'm really sorry for hurting you 💔<br>
      I never wanted to make you sad.<br>
      Please give me one chance to make everything right 🥺
    </div>

    <!-- BUTTON -->
    <a href="#" class="btn">
      Listen to my heart 💖
    </a>

  </div>

</body>
</html>
